apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-app
  namespace: demo-app
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: demo-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: demo-app/config
        property: api-token
