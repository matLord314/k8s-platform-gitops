controller:
  replicaCount: 2
  hostPort:
    enabled: false
  ingressClassResource:
    name: nginx
    default: false
  service:
    type: LoadBalancer
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
