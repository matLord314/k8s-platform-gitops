controller:
  replicaCount: 1
  hostPort:
    enabled: true
  ingressClassResource:
    name: nginx
    default: true
  nodeSelector:
    kubernetes.io/os: linux
    ingress-ready: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  service:
    type: NodePort
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  resources:
    requests:
      cpu: 50m
      memory: 90Mi
    limits:
      memory: 256Mi
