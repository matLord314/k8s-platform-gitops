replicaCount: 2

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: "6.15.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  port: 9898

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  startup:
    httpGet:
      path: /healthz
      port: http
    failureThreshold: 12
    periodSeconds: 5
  liveness:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

pdb:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true
  ingressNamespaces:
    - ingress-nginx
    - monitoring

vault:
  enabled: true
  secretName: demo-app-secrets
  optional: true
  mountPath: /var/run/secrets/vault

ingress:
  enabled: true
  className: nginx
  host: demo.127.0.0.1.nip.io
  clusterIssuer: platform-ca
  tls:
    enabled: true
  annotations: {}

serviceMonitor:
  enabled: true
  interval: 30s
  labels:
    release: kube-prometheus-stack
